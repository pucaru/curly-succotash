name: Independent sound-steer scale placement sweep
on:
  push:
    branches:
      - experiment/sound-steer-scale-20261121-1828
    paths:
      - bot.py
      - bench/one_hero_ffa.py
      - .github/workflows/sound-steer-sweep.yml
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        scale: [0.0, 1.0, 2.0]
        opponent: [v1, v2, mixed]
    env:
      SCALE: ${{ matrix.scale }}
      OPP_KIND: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick isolated sound steering policy
        shell: bash
        run: |
          set -euo pipefail
          echo "MECH_TUNE={\"sound_steer_scale\":${SCALE}}" >> "$GITHUB_ENV"
          case "$OPP_KIND" in
            v1) echo 'OPP=tools.baseline.brain_v1' >> "$GITHUB_ENV" ;;
            v2) echo 'OPP=tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            mixed) echo 'OPP=tools.baseline.brain_v1,tools.baseline.brain_v1,tools.baseline.brain_v2,tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
      - name: Syntax and behavior regression
        run: |
          python3 -m py_compile bot.py arena.py mechfight.py bench/one_hero_ffa.py
          python3 -m unittest discover -s tests -v
      - name: Use pinned independent MIT simulator
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cd "$RUNNER_TEMP/sim"
          git checkout --detach b76c216d8a7829e14409a42058eea93e46e9ccdb
          cp "$GITHUB_WORKSPACE/bot.py" "$GITHUB_WORKSPACE/arena.py" .
          cp "$GITHUB_WORKSPACE/bench/one_hero_ffa.py" tools/one_hero_ffa.py
          printf 'from bot import Bot as Brain\n' > survivor_adapter.py
      - name: Cooperative squad on 24 new paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 24 -j 4 --seed 781121 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-sound-scale.txt"
      - name: One-entry FFA on 24 new paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/one_hero_ffa.py -n 24 -j 4 --seed 881121 \
            --opp "$OPP" 2>&1 | tee "$GITHUB_WORKSPACE/ffa-sound-scale.txt"
      - name: Preserve raw trial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-scale-${{ matrix.scale }}-${{ matrix.opponent }}
          path: |
            squad-sound-scale.txt
            ffa-sound-scale.txt
          if-no-files-found: ignore
