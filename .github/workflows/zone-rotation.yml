name: Independent circle-rotation placement A/B
on:
  push:
    branches:
      - experiment/zone-rotation-20261121-1630
    paths:
      - .github/workflows/zone-rotation.yml
      - bot.py
      - tests/test_zone_rotation.py
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        buffer: [0, 25, 45]
        opponent: [tools.baseline.brain_v1, tools.baseline.brain_v2]
    env:
      MECH_TUNE: '{"zone_rotation_buffer":${{ matrix.buffer }}}'
      OPP: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Python unit checks
        run: python3 -m unittest discover -s tests -v
      - name: Fetch independent MIT-licensed simulator
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cp bot.py arena.py "$RUNNER_TEMP/sim/"
          printf 'from bot import Bot as Brain\n' > "$RUNNER_TEMP/sim/survivor_adapter.py"
      - name: Cooperative hunter squad - 12 paired fresh seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 12 -j 4 --seed 106731 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-results.txt"
      - name: Free-for-all - 6 paired fresh seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 6 -j 3 --seed 550241 --mode ffa \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/ffa-results.txt"
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zone-rotation-${{ matrix.buffer }}-${{ matrix.opponent }}
          path: |
            squad-results.txt
            ffa-results.txt
          if-no-files-found: ignore
