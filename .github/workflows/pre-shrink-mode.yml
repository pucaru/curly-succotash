name: Independent first-shrink FFA attribution screen
on:
  push:
    branches:
      - experiment/pre-shrink-mode-20261121-2330
    paths:
      - .github/workflows/pre-shrink-mode.yml
  workflow_dispatch:
concurrency:
  group: pre-shrink-mode-20261121-2330
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        first_shrink_mode: [0, 1]
        opponent: [v1, v2, mixed]
    env:
      VALUE: ${{ matrix.first_shrink_mode }}
      OPP_KIND: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure exactly one first-shrink FFA evidence gate
        shell: bash
        run: |
          set -euo pipefail
          echo "MECH_TUNE={\"pre_shrink_ffa_only\":${VALUE}}" >> "$GITHUB_ENV"
          case "$OPP_KIND" in
            v1) echo 'OPP=tools.baseline.brain_v1' >> "$GITHUB_ENV" ;;
            v2) echo 'OPP=tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            mixed) echo 'OPP=tools.baseline.brain_v1,tools.baseline.brain_v1,tools.baseline.brain_v2,tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
      - name: Syntax and strategy conformance
        run: |
          python3 -m py_compile bot.py arena.py mechfight.py bench/one_hero_ffa.py bench/aggregate_pre_shrink_mode.py
          python3 -c 'import os; from bot import TUNE; assert TUNE["pre_shrink_ffa_only"] == int(os.environ["VALUE"])'
          python3 -m unittest discover -s tests -v
      - name: Clone reproducible independently implemented MIT simulation
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cd "$RUNNER_TEMP/sim"
          git checkout --detach b76c216d8a7829e14409a42058eea93e46e9ccdb
          cp "$GITHUB_WORKSPACE/bot.py" "$GITHUB_WORKSPACE/arena.py" .
          cp "$GITHUB_WORKSPACE/bench/one_hero_ffa.py" tools/one_hero_ffa.py
          printf 'from bot import Bot as Brain\n' > survivor_adapter.py
      - name: Cooperative squad - 12 new paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 12 -j 4 --seed 1610211 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-pre-shrink-mode.txt"
      - name: One-entrant FFA - 12 new paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/one_hero_ffa.py -n 12 -j 4 --seed 1620211 \
            --opp "$OPP" 2>&1 | tee "$GITHUB_WORKSPACE/ffa-pre-shrink-mode.txt"
      - name: Preserve per-seed output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-shrink-mode-${{ matrix.first_shrink_mode }}-${{ matrix.opponent }}
          path: |
            squad-pre-shrink-mode.txt
            ffa-pre-shrink-mode.txt
          if-no-files-found: ignore
  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all six paired cells
        uses: actions/download-artifact@v4
        with:
          pattern: pre-shrink-mode-*
          path: bench-artifacts
      - name: Validate 144 paired matches and publish first-shrink evidence audit
        run: python3 bench/aggregate_pre_shrink_mode.py
      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-shrink-mode-summary
          path: pre-shrink-mode-results.md
          if-no-files-found: ignore
