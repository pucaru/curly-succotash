name: Independent authoritative kill-track purge screen
on:
  push:
    branches:
      - experiment/kill-track-purge-20261122-0155
    paths:
      - .github/workflows/kill-track-purge.yml
  workflow_dispatch:
concurrency:
  group: kill-track-purge-20261122-0155
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        kill_track_purge: [0, 1]
        opponent: [v1, v2, mixed]
    env:
      VALUE: ${{ matrix.kill_track_purge }}
      OPP_KIND: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Set candidate or control authoritative kill-track purge
        shell: bash
        run: |
          set -euo pipefail
          echo "MECH_TUNE={\"kill_track_purge\":${VALUE}}" >> "$GITHUB_ENV"
          case "$OPP_KIND" in
            v1) echo 'OPP=tools.baseline.brain_v1' >> "$GITHUB_ENV" ;;
            v2) echo 'OPP=tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            mixed) echo 'OPP=tools.baseline.brain_v1,tools.baseline.brain_v1,tools.baseline.brain_v2,tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
      - name: Validate corrected kill-track-purge tests and candidate/control configuration
        run: |
          python3 -m py_compile bot.py arena.py mechfight.py bench/one_hero_ffa.py bench/aggregate_kill_track_purge.py
          python3 -c 'import os; from bot import TUNE; assert TUNE["kill_track_purge"] == int(os.environ["VALUE"])'
          python3 -m unittest discover -s tests -v
      - name: Clone reproducible independently implemented MIT simulation
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cd "$RUNNER_TEMP/sim"
          git checkout --detach b76c216d8a7829e14409a42058eea93e46e9ccdb
          cp "$GITHUB_WORKSPACE/bot.py" "$GITHUB_WORKSPACE/arena.py" .
          cp "$GITHUB_WORKSPACE/bench/one_hero_ffa.py" tools/one_hero_ffa.py
          printf 'from bot import Bot as Brain\n' > survivor_adapter.py
      - name: Cooperative squad - 12 new paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 12 -j 4 --seed 1850211 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-kill-track-purge.txt"
      - name: One-entrant FFA - 12 new paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/one_hero_ffa.py -n 12 -j 4 --seed 1860211 \
            --opp "$OPP" 2>&1 | tee "$GITHUB_WORKSPACE/ffa-kill-track-purge.txt"
      - name: Preserve per-seed output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kill-track-purge-${{ matrix.kill_track_purge }}-${{ matrix.opponent }}
          path: |
            squad-kill-track-purge.txt
            ffa-kill-track-purge.txt
          if-no-files-found: ignore
  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all six paired cells
        uses: actions/download-artifact@v4
        with:
          pattern: kill-track-purge-*
          path: bench-artifacts
      - name: Validate 144 paired matches and publish authoritative kill-track purge audit
        run: python3 bench/aggregate_kill_track_purge.py
      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kill-track-purge-summary
          path: kill-track-purge-results.md
          if-no-files-found: ignore
