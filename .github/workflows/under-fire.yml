name: Paired under-fire survival A/B
on:
  push:
    branches:
      - experiment/escape-under-fire-20261121-1730
    paths:
      - bot.py
      - tests/test_under_fire.py
      - .github/workflows/under-fire.yml
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        policy: [baseline, sprint, laser, combined]
        opponent: [tools.baseline.brain_v1, tools.baseline.brain_v2]
    env:
      POLICY: ${{ matrix.policy }}
      OPP: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure policy toggles
        shell: bash
        run: |
          case "$POLICY" in
            baseline) echo 'MECH_TUNE={"panic_boost":false,"escape_no_laser_charge":false}' >> "$GITHUB_ENV" ;;
            sprint) echo 'MECH_TUNE={"panic_boost":true,"escape_no_laser_charge":false}' >> "$GITHUB_ENV" ;;
            laser) echo 'MECH_TUNE={"panic_boost":false,"escape_no_laser_charge":true}' >> "$GITHUB_ENV" ;;
            combined) echo 'MECH_TUNE={"panic_boost":true,"escape_no_laser_charge":true}' >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
      - name: Test syntax and isolated behavior
        run: |
          python3 -m py_compile bot.py arena.py mechfight.py
          python3 -m unittest discover -s tests -v
      - name: Fetch pinned MIT-licensed independent simulator
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cd "$RUNNER_TEMP/sim"
          git checkout --detach b76c216d8a7829e14409a42058eea93e46e9ccdb
          cp "$GITHUB_WORKSPACE/bot.py" "$GITHUB_WORKSPACE/arena.py" .
          printf 'from bot import Bot as Brain\n' > survivor_adapter.py
      - name: Cooperative practice squad - 16 paired new seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 16 -j 4 --seed 311221 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-results.txt"
      - name: Free-for-all - 8 paired new seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 8 -j 4 --seed 761221 --mode ffa \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/ffa-results.txt"
      - name: Preserve placement diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: under-fire-${{ matrix.policy }}-${{ matrix.opponent }}
          path: |
            squad-results.txt
            ffa-results.txt
          if-no-files-found: ignore
