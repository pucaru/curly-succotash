name: Independent idle magazine preparation screen
on:
  push:
    branches:
      - experiment/idle-magazine-prep-20261122-1130
    paths:
      - .github/workflows/idle-magazine-prep.yml
      - bench/one_hero_ffa.py
      - tests/test_idle_reload.py
      - bot.py
  workflow_dispatch:
concurrency:
  group: idle-magazine-prep-20261122-1130
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        idle_reload: [0, 1]
        opponent: [v1, v2, mixed]
    env:
      VALUE: ${{ matrix.idle_reload }}
      OPP_KIND: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Set candidate or control idle magazine preparation
        shell: bash
        run: |
          set -euo pipefail
          echo "MECH_TUNE={\"idle_reload\":${VALUE}}" >> "$GITHUB_ENV"
          case "$OPP_KIND" in
            v1) echo 'OPP=tools.baseline.brain_v1' >> "$GITHUB_ENV" ;;
            v2) echo 'OPP=tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            mixed) echo 'OPP=tools.baseline.brain_v1,tools.baseline.brain_v1,tools.baseline.brain_v2,tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
      - name: Validate idle-magazine-prep tests and candidate/control configuration
        run: |
          python3 -m py_compile bot.py arena.py mechfight.py bench/one_hero_ffa.py bench/aggregate_idle_reload.py
          python3 -c 'import os; from bot import TUNE; assert TUNE["idle_reload"] == int(os.environ["VALUE"])'
          python3 -m unittest discover -s tests -v
      - name: Clone reproducible independently implemented MIT simulation
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cd "$RUNNER_TEMP/sim"
          git checkout --detach b76c216d8a7829e14409a42058eea93e46e9ccdb
          cp "$GITHUB_WORKSPACE/bot.py" "$GITHUB_WORKSPACE/arena.py" .
          cp "$GITHUB_WORKSPACE/bench/one_hero_ffa.py" tools/one_hero_ffa.py
          printf 'from bot import Bot as Brain\n' > survivor_adapter.py
      - name: Cooperative squad - 12 new paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 12 -j 4 --seed 3175101 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-idle-magazine-prep.txt"
      - name: One-entrant FFA - 12 new paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/one_hero_ffa.py -n 12 -j 4 --seed 3176101 \
            --opp "$OPP" 2>&1 | tee "$GITHUB_WORKSPACE/ffa-idle-magazine-prep.txt"
      - name: Preserve per-seed output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-magazine-prep-${{ matrix.idle_reload }}-${{ matrix.opponent }}
          path: |
            squad-idle-magazine-prep.txt
            ffa-idle-magazine-prep.txt
          if-no-files-found: ignore
  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all six paired cells
        uses: actions/download-artifact@v4
        with:
          pattern: idle-magazine-prep-*
          path: bench-artifacts
      - name: Validate 144 paired matches and publish idle magazine preparation audit
        run: python3 bench/aggregate_idle_reload.py
      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-magazine-prep-summary
          path: idle-magazine-prep-results.md
          if-no-files-found: ignore
