name: Defensive facing paired placement A/B
on:
  push:
    branches:
      - experiment/defensive-facing-20261121-1750
    paths:
      - bot.py
      - tests/test_defensive_facing.py
      - .github/workflows/defensive-facing.yml
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        facing: [0.0, 85.0, 155.0]
        opponent: [tools.baseline.brain_v1, tools.baseline.brain_v2]
    env:
      FACING_RANGE: ${{ matrix.facing }}
      OPP: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure defensive orientation
        shell: bash
        run: |
          echo "MECH_TUNE={\"defensive_facing_range\":${FACING_RANGE}}" >> "$GITHUB_ENV"
      - name: Syntax and unit checks
        run: |
          python3 -m py_compile bot.py arena.py mechfight.py
          python3 -m unittest discover -s tests -v
      - name: Fetch independent pinned MIT match simulator
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cd "$RUNNER_TEMP/sim"
          git checkout --detach b76c216d8a7829e14409a42058eea93e46e9ccdb
          cp "$GITHUB_WORKSPACE/bot.py" "$GITHUB_WORKSPACE/arena.py" .
          printf 'from bot import Bot as Brain\n' > survivor_adapter.py
      - name: Cooperative squad - 16 paired new seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 16 -j 4 --seed 651221 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-results.txt"
      - name: Free-for-all - 8 paired new seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 8 -j 4 --seed 991221 --mode ffa \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/ffa-results.txt"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defensive-facing-${{ matrix.facing }}-${{ matrix.opponent }}
          path: |
            squad-results.txt
            ffa-results.txt
          if-no-files-found: ignore
