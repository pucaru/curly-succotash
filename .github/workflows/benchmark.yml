name: Adaptive FFA policy validation
on:
  push:
    paths:
      - .github/workflows/benchmark.yml
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: squad-baseline-v1
            opponent: tools.baseline.brain_v1
            tune: '{}'
          - label: ffa-adaptive-v1
            opponent: tools.baseline.brain_v1
            tune: '{"ffa_focus":true}'
          - label: squad-baseline-v2
            opponent: tools.baseline.brain_v2
            tune: '{}'
          - label: ffa-adaptive-v2
            opponent: tools.baseline.brain_v2
            tune: '{"ffa_focus":true}'
    env:
      MECH_TUNE: ${{ matrix.tune }}
      OPP: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve simulator
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cp bot.py arena.py "$RUNNER_TEMP/sim/"
          printf 'from bot import Bot as Brain\n' > "$RUNNER_TEMP/sim/survivor_adapter.py"
      - name: Squad / 12 paired seeds
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 12 -j 4 --seed 99101 --mode squad --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-results.txt"
      - name: FFA / 6 paired seeds
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 6 -j 3 --seed 50117 --mode ffa --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/ffa-results.txt"
      - name: Preserve scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-${{ matrix.label }}
          path: |
            squad-results.txt
            ffa-results.txt
          if-no-files-found: ignore
