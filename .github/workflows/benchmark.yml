name: Squad combat and farming strategy comparison
on:
  push:
    paths:
      - .github/workflows/benchmark.yml
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - label: baseline
            tune: '{}'
          - label: squad-attack
            tune: '{"squad_aggressive":true}'
          - label: early-farm
            tune: '{"farm_hunt":true}'
          - label: attack-and-farm
            tune: '{"squad_aggressive":true,"farm_hunt":true}'
          - label: attack-farm-boost
            tune: '{"squad_aggressive":true,"farm_hunt":true,"combat_boost":true}'
          - label: attack-farm-focus
            tune: '{"squad_aggressive":true,"farm_hunt":true,"focus":250,"attacker":280,"finish":180}'
    env:
      MECH_TUNE: ${{ matrix.tune }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve simulator
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cp bot.py arena.py "$RUNNER_TEMP/sim/"
          printf 'from bot import Bot as Brain\n' > "$RUNNER_TEMP/sim/survivor_adapter.py"
      - name: Squad / 12 held-out seeds
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 12 -j 4 --seed 44131 --mode squad --hero survivor_adapter --opp tools.baseline.brain_v1 --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-results.txt"
      - name: FFA / 4 held-out seeds
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 4 -j 4 --seed 21221 --mode ffa --hero survivor_adapter --opp tools.baseline.brain_v1 --diag 2>&1 | tee "$GITHUB_WORKSPACE/ffa-results.txt"
      - name: Preserve scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-${{ matrix.label }}
          path: |
            squad-results.txt
            ffa-results.txt
          if-no-files-found: ignore
