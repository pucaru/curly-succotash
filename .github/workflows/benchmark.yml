name: Placement policy holdout and movement experiments
on:
  push:
    paths:
      - .github/workflows/benchmark.yml
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - label: baseline-holdout
            tune: '{}'
          - label: hyper-focus-holdout
            tune: '{"focus":260,"attacker":310,"finish":180,"duel_hp":0.25,"duel_range":200,"cover_hp":0.24,"hurt_cover_hp":0.4}'
          - label: boosted-duel
            tune: '{"combat_boost":true}'
          - label: wide-duel
            tune: '{"duel_desire":120}'
          - label: boosted-focus
            tune: '{"combat_boost":true,"focus":260,"attacker":310,"finish":180,"duel_hp":0.25,"duel_range":200,"cover_hp":0.24,"hurt_cover_hp":0.4}'
          - label: zone-and-reload
            tune: '{"zone_safe":true,"idle_reload":true}'
          - label: jet-cover
            tune: '{"jet_escape":true,"combat_boost":true}'
    env:
      MECH_TUNE: ${{ matrix.tune }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve simulator
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cp bot.py arena.py "$RUNNER_TEMP/sim/"
          printf 'from bot import Bot as Brain\n' > "$RUNNER_TEMP/sim/survivor_adapter.py"
      - name: Squad / 12 held-out seeds
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 12 -j 4 --seed 32011 --mode squad --hero survivor_adapter --opp tools.baseline.brain_v1 --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-results.txt"
      - name: FFA / 4 held-out seeds
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 4 -j 4 --seed 8821 --mode ffa --hero survivor_adapter --opp tools.baseline.brain_v1 --diag 2>&1 | tee "$GITHUB_WORKSPACE/ffa-results.txt"
      - name: Preserve scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-${{ matrix.label }}
          path: |
            squad-results.txt
            ffa-results.txt
          if-no-files-found: ignore
