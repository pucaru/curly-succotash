name: Independent guided unstuck placement A/B
on:
  push:
    branches:
      - experiment/guided-unstuck-20261121-1630
    paths:
      - .github/workflows/guided-unstuck.yml
      - bot.py
      - tests/test_guided_unstuck.py
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        guided: ["false", "true"]
        opponent: [tools.baseline.brain_v1, tools.baseline.brain_v2]
    env:
      MECH_TUNE: '{"guided_unstuck":${{ matrix.guided }}}'
      OPP: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Python unit checks
        run: python3 -m unittest discover -s tests -v
      - name: Fetch independent MIT-licensed simulator
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cp bot.py arena.py "$RUNNER_TEMP/sim/"
          printf 'from bot import Bot as Brain\n' > "$RUNNER_TEMP/sim/survivor_adapter.py"
      - name: Cooperative squad - 12 paired fresh seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 12 -j 4 --seed 208101 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-results.txt"
      - name: Free-for-all - 6 paired fresh seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 6 -j 3 --seed 550981 --mode ffa \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/ffa-results.txt"
      - name: Save scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unstuck-${{ matrix.guided }}-${{ matrix.opponent }}
          path: |
            squad-results.txt
            ffa-results.txt
          if-no-files-found: ignore
