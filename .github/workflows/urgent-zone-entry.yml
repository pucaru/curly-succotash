name: Independent urgent-zone entry waypoint comparison
on:
  push:
    branches:
      - experiment/urgent-zone-entry-20261121-2212
    paths:
      - .github/workflows/urgent-zone-entry.yml
  workflow_dispatch:
concurrency:
  group: urgent-zone-entry-20261121-2212
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        entry_margin: [0, 24, 64]
        opponent: [v1, v2, mixed]
    env:
      VALUE: ${{ matrix.entry_margin }}
      OPP_KIND: ${{ matrix.opponent }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure exactly one safe-zone entry margin and opponent group
        shell: bash
        run: |
          set -euo pipefail
          echo "MECH_TUNE={\"urgent_zone_entry_margin\":${VALUE}}" >> "$GITHUB_ENV"
          case "$OPP_KIND" in
            v1) echo 'OPP=tools.baseline.brain_v1' >> "$GITHUB_ENV" ;;
            v2) echo 'OPP=tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            mixed) echo 'OPP=tools.baseline.brain_v1,tools.baseline.brain_v1,tools.baseline.brain_v2,tools.baseline.brain_v2' >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
      - name: Syntax and strategy conformance
        run: |
          python3 -m py_compile bot.py arena.py mechfight.py bench/one_hero_ffa.py bench/aggregate_urgent_entry.py
          python3 -m unittest discover -s tests -v
      - name: Clone reproducible independently implemented MIT simulation
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/VivekRnx/bob-the-builder-2026.git "$RUNNER_TEMP/sim"
          cd "$RUNNER_TEMP/sim"
          git checkout --detach b76c216d8a7829e14409a42058eea93e46e9ccdb
          cp "$GITHUB_WORKSPACE/bot.py" "$GITHUB_WORKSPACE/arena.py" .
          cp "$GITHUB_WORKSPACE/bench/one_hero_ffa.py" tools/one_hero_ffa.py
          printf 'from bot import Bot as Brain\n' > survivor_adapter.py
      - name: Cooperative squad - 24 independent paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/sim.py -n 24 -j 4 --seed 953611 --mode squad \
            --hero survivor_adapter --opp "$OPP" --diag 2>&1 | tee "$GITHUB_WORKSPACE/squad-urgent-zone-entry.txt"
      - name: One-entrant FFA - 24 independent paired seeds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim"
          python3 tools/one_hero_ffa.py -n 24 -j 4 --seed 963611 \
            --opp "$OPP" 2>&1 | tee "$GITHUB_WORKSPACE/ffa-urgent-zone-entry.txt"
      - name: Preserve per-seed output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urgent-zone-entry-${{ matrix.entry_margin }}-${{ matrix.opponent }}
          path: |
            squad-urgent-zone-entry.txt
            ffa-urgent-zone-entry.txt
          if-no-files-found: ignore
  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all nine comparison artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: urgent-zone-entry-*
          path: bench-artifacts
      - name: Check all 432 placements and publish paired zone-exposure audit
        run: python3 bench/aggregate_urgent_entry.py
      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urgent-zone-entry-summary
          path: urgent-zone-entry-results.md
          if-no-files-found: ignore
